# ============================================================================
#  MegaOrbitals 1.4.0 - main configuration
#  Every cannon has its own file in: plugins/MegaOrbitals/configs/<cannon>.yml
#  Run /orbital reload after editing anything.
# ============================================================================

# Do not touch. Used to upgrade old config files automatically.
config-version: 2

# ----------------------------------------------------------------------------
general:
  # How far players can target, in blocks. 0 = unlimited (any loaded block you can see).
  max-range: 0
  # How many blocks cannons may check/change per tick across ALL strikes.
  # Lower = less lag, but big cannons (mega nuke, superlaser...) take longer to finish.
  blocks-per-tick: 40000
  # Print extra information to the console.
  debug: false

# ----------------------------------------------------------------------------
worlds:
  # blacklist = cannons work everywhere EXCEPT the listed worlds
  # whitelist = cannons ONLY work in the listed worlds
  mode: blacklist
  list: []

# ----------------------------------------------------------------------------
safety:
  # Master switch. false = no cannon can break or change blocks, whatever its own config says.
  allow-block-damage: true
  # Multiplies all direct damage dealt by cannons (lasers, beams, drains, the nuke ...).
  # Explosions are not affected.
  damage-multiplier: 1.0
  # Can the person who fired a cannon be hurt by it?
  #   default = use each cannon's own hurt-shooter setting
  #   always  = the shooter is always affected
  #   never   = the shooter is never affected
  hurt-shooter: default
  # Players with the permission megaorbitals.immune are never targeted by cannons.
  respect-immunity: true
  # Cannons cannot be aimed within this many blocks of a world's spawn point. 0 = off.
  spawn-protection-radius: 0
  # Maximum cannons fired per minute across the whole server. 0 = unlimited.
  max-fires-per-minute: 0

# ----------------------------------------------------------------------------
cooldowns:
  # Seconds a player must wait between firing cannon ITEMS.
  item-seconds: 3
  # Seconds a player must wait between /orbital commands.
  command-seconds: 0
  # Extra cooldowns for specific cannons, in seconds (applied to items and commands).
  per-cannon:
    meganuke: 300
    omega: 600
  # Players with this permission ignore all cooldowns.
  bypass-permission: megaorbitals.bypass.cooldown

# ----------------------------------------------------------------------------
items:
  # Use up one item each time a cannon item is fired.
  consume-on-use: true
  # Enchantment glint on cannon items.
  glow: true
  # Players must be sneaking to fire a cannon item (prevents accidents).
  require-sneak: false
  # Allow firing from the off hand.
  allow-off-hand: true
  # Extra lore lines added under every cannon's own description. {uses} = "One-time use" or "Reusable".
  usage-lore:
    - ""
    - "&eRight-click &7to call the strike"
    - "&7on the block you are looking at."
    - "&8{uses}"

# ----------------------------------------------------------------------------
cannons:
  # Cannon ids that can't be fired or given. Example: [meganuke, omega]
  disabled: []
  # If true, firing a cannon ITEM also needs the permission megaorbitals.cannon.<id>
  per-cannon-permission: false

# ----------------------------------------------------------------------------
announce:
  # Tell players when an orbital is fired.
  enabled: false
  # 0 = whole server, otherwise only players within this many blocks of the target.
  radius: 0
  message: "&c&l[ORBITAL] &f{player} &7fired &r{cannon} &7at &f{x}, {y}, {z}&7!"
  # Sound played to everyone who sees the announcement. Leave empty for none.
  sound: "entity.wither.spawn"

# ----------------------------------------------------------------------------
logging:
  # Write a line to the console every time a cannon is fired.
  log-fires: true

# ----------------------------------------------------------------------------
# Messages now live in lang/<language>.yml. Copy lang/en.yml to translate.
language: en

# ----------------------------------------------------------------------------
# UNDO / ROLLBACK - every block a strike changes is remembered so it can be put back.
#   /orbital undo            undo your last strike (ops with megaorbitals.undo.others: the last strike by anyone)
#   /orbital undo <player>   undo that player's last strike
#   /orbital undo all        undo every remembered strike
#   /orbital history         list strikes that can still be undone
# Not covered: fire spreading or liquids flowing on their own, and the contents of chests that get destroyed.
rollback:
  enabled: true
  # Put terrain back automatically this many seconds after a strike. 0 = never.
  # Each cannon can override this with auto-restore-seconds in its own yml.
  auto-restore-seconds: 0
  # Forget strikes older than this (they can no longer be undone).
  keep-minutes: 60
  # Safety cap on remembered blocks per strike (about 12 bytes each). The mega nuke can change far more;
  # anything past the cap simply can't be undone.
  max-blocks-per-strike: 5000000

# ----------------------------------------------------------------------------
# CRAFTING - Orbital Cores come in four tiers. Each tier is crafted from the tier below it,
# and right-clicking a core turns it into a random cannon of that tier.
# Ingredients are a MATERIAL name or core:<tier>.
crafting:
  enabled: true
  recipes:
    common:
      shape: [" I ", "IRI", " I "]
      ingredients: {I: IRON_INGOT, R: REDSTONE_BLOCK}
    rare:
      shape: ["DTD", "TCT", "DTD"]
      ingredients: {D: DIAMOND, T: TNT, C: "core:common"}
    epic:
      shape: ["NEN", "ECE", "NEN"]
      ingredients: {N: NETHERITE_SCRAP, E: ENDER_EYE, C: "core:rare"}
    legendary:
      shape: ["IBI", "BCB", "IBI"]
      ingredients: {I: NETHERITE_INGOT, B: DRAGON_BREATH, C: "core:epic"}
    binoculars:
      shape: ["SRS", " C "]
      ingredients: {S: SPYGLASS, R: REDSTONE, C: COMPASS}
    satellite:
      shape: ["GDG", "IBI", "GDG"]
      ingredients: {G: GLASS, D: DAYLIGHT_DETECTOR, I: IRON_BLOCK, B: BEACON}

# Cores dropped by mobs killed by players: ENTITY_TYPE: "tier:chance" (1.0 = always).
# ANY_MONSTER applies to every other hostile mob. Mobs spawned by cannons never drop cores.
drops-enabled: true
drops:
  ENDER_DRAGON: "legendary:1.0"
  WITHER: "legendary:0.35"
  WARDEN: "epic:0.5"
  ELDER_GUARDIAN: "epic:0.5"
  EVOKER: "rare:0.25"
  RAVAGER: "rare:0.2"
  PIGLIN_BRUTE: "rare:0.1"
  ANY_MONSTER: "common:0.005"

# ----------------------------------------------------------------------------
# SPOTTER BINOCULARS - left-click to mark a target; your cannons then hit the mark.
spotter:
  range: 512
  mark-seconds: 180
  # Clear the mark after one cannon is fired at it.
  clear-after-fire: false

# ----------------------------------------------------------------------------
# SATELLITES - when enabled, firing a cannon ITEM needs one of your satellites over the target with
# enough charge. Admin /orbital commands and megaorbitals.bypass.satellite skip this.
satellites:
  enabled: false
  radius: 400
  max-charge: 100
  start-charge: 50
  recharge-per-minute: 5
  max-per-player: 3
  # true = anyone may use anyone's satellites.
  shared: false
  # Charge each tier costs to fire.
  cost: {common: 10, rare: 25, epic: 50, legendary: 100}

# ----------------------------------------------------------------------------
# DISCORD - post to a webhook when big cannons are fired.
discord:
  enabled: false
  webhook-url: ""
  username: "MegaOrbitals"
  # Alert for every cannon of these tiers...
  tiers: [legendary]
  # ...and for these cannons too.
  cannons: [omega, meganuke]
  message: ":rotating_light: **{player}** fired **{cannon}** ({tier}) at `{world} {x} {y} {z}`"

# ----------------------------------------------------------------------------
# UPDATE CHECKER - tells ops (megaorbitals.update) when a newer release is on GitHub.
update-checker:
  enabled: true
  repo: "NeonWardonmc/mega-orbitals"
  every-hours: 6
