# zoglinstampede.yml - MegaOrbitals cannon: Zoglin Stampede
#   A herd of zoglins thunders straight
#   through the target from the far side.
# Fire with /orbital zoglinstampede   Give with /orbitalgive zoglinstampede
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&c&lZoglin Stampede'
# Description lines on the item.
lore:
- A herd of zoglins thunders straight
- through the target from the far side.
# Item type of the cannon item.
item: PORKCHOP
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 25
# Colour of the targeting ring.
warning-color: '#C06060'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Number of zoglins.
  zoglins: 12
  # How far away they start their charge.
  start-distance: 25
