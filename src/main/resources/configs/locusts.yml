# locusts.yml - MegaOrbitals cannon: Locust Plague
#   A plague of locusts strips the land bare:
#   crops, grass, flowers and leaves, devoured.
# Fire with /orbital locusts   Give with /orbitalgive locusts
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&2&lLocust Plague'
# Description lines on the item.
lore:
- 'A plague of locusts strips the land bare:'
- crops, grass, flowers and leaves, devoured.
# Item type of the cannon item.
item: WHEAT
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 15
# Colour of the targeting ring.
warning-color: '#607020'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 25
  # How long the swarm feeds.
  seconds: 25
  # Plants eaten each second.
  eaten-per-second: 60
