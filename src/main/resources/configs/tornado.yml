# tornado.yml - MegaOrbitals cannon: Tornado
#   A wandering tornado that sucks up
#   everything and flings it away.
# Fire with /orbital tornado   Give with /orbitalgive tornado
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&7&lTornado'
# Description lines on the item.
lore:
- A wandering tornado that sucks up
- everything and flings it away.
# Item type of the cannon item.
item: STRING
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 30
# Colour of the targeting ring.
warning-color: '#B0B0B0'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # How long the tornado lasts.
  seconds: 20
  # How close you must be to get sucked in.
  pull-radius: 9
  # Height of the funnel.
  height: 30
  # How fast it wanders.
  speed: 0.25
  # Rip blocks out of the ground.
  rip-blocks: true
