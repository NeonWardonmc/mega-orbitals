# hellfloor.yml - MegaOrbitals cannon: Hellfloor
#   The floor becomes magma and soul fire.
#   There's nowhere safe to stand.
# Fire with /orbital hellfloor   Give with /orbitalgive hellfloor
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&4&lHellfloor'
# Description lines on the item.
lore:
- The floor becomes magma and soul fire.
- There's nowhere safe to stand.
# Item type of the cannon item.
item: SOUL_CAMPFIRE
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 20
# Colour of the targeting ring.
warning-color: '#C03010'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Size of the floor.
  radius: 16
  # Chance of soul fire on each spot (0-1).
  soul-fire-chance: 0.3
