# spacestation.yml - MegaOrbitals cannon: Space Station
#   Builds a floating sky base above the target
#   with glass walls and a landing pad.
# Fire with /orbital spacestation   Give with /orbitalgive spacestation
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&b&lSpace Station'
# Description lines on the item.
lore:
- Builds a floating sky base above the target
- with glass walls and a landing pad.
# Item type of the cannon item.
item: BEACON
# common, rare, epic or legendary (sets crafting core, drop pool and satellite charge cost).
tier: legendary
# Menu tab this cannon is listed under.
category: space
# Put the terrain back after this many seconds (-1 = use config.yml, 0 = never).
auto-restore-seconds: -1
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 30
# Colour of the targeting ring.
warning-color: '#60C0FF'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # How high above the target the station floats.
  height: 50
  # Radius of the main room.
  radius: 7
  # Beam the shooter up to the landing pad once it is built.
  teleport-shooter: true
  # Blocks placed per tick (lower = slower, more dramatic build).
  build-speed: 600
