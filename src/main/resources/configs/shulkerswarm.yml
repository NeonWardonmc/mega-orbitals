# shulkerswarm.yml - MegaOrbitals cannon: Shulker Storm
#   Homing shulker bullets chase everyone.
#   Each hit makes you float helplessly.
# Fire with /orbital shulkerswarm   Give with /orbitalgive shulkerswarm
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&d&lShulker Storm'
# Description lines on the item.
lore:
- Homing shulker bullets chase everyone.
- Each hit makes you float helplessly.
# Item type of the cannon item.
item: SHULKER_SHELL
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 20
# Colour of the targeting ring.
warning-color: '#D080FF'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 30
  # Bullets fired at each target.
  bullets-per-target: 6
