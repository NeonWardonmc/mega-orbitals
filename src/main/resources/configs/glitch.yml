# glitch.yml - MegaOrbitals cannon: Reality Glitch
#   Reality glitches: blocks swap places
#   at random and everyone flickers around.
# Fire with /orbital glitch   Give with /orbitalgive glitch
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&5&lReality Glitch'
# Description lines on the item.
lore:
- 'Reality glitches: blocks swap places'
- at random and everyone flickers around.
# Item type of the cannon item.
item: STRUCTURE_VOID
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 20
# Colour of the targeting ring.
warning-color: '#A000FF'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 12
  # Number of block swaps.
  swaps: 1500
  # How long it glitches.
  seconds: 8
