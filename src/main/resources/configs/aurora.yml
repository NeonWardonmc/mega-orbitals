# aurora.yml - MegaOrbitals cannon: Aurora
#   Harmless and beautiful: shimmering ribbons
#   of aurora light dance across the sky.
# Fire with /orbital aurora   Give with /orbitalgive aurora
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&a&lAurora'
# Description lines on the item.
lore:
- 'Harmless and beautiful: shimmering ribbons'
- of aurora light dance across the sky.
# Item type of the cannon item.
item: LIGHT_BLUE_STAINED_GLASS
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 5
# Colour of the targeting ring.
warning-color: '#60FFC0'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # How long the aurora lasts.
  seconds: 60
  # Height of the aurora.
  height: 40
  # Width of the aurora.
  width: 80
