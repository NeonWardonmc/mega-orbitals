# capturenet.yml - MegaOrbitals cannon: Capture Net
#   A capture net scoops up every mob in range
#   and gives you their spawn eggs.
# Fire with /orbital capturenet   Give with /orbitalgive capturenet
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&a&lCapture Net'
# Description lines on the item.
lore:
- A capture net scoops up every mob in range
- and gives you their spawn eggs.
# Item type of the cannon item.
item: COBWEB
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 10
# Colour of the targeting ring.
warning-color: '#80C080'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 15
  # Also capture withers and wardens.
  include-bosses: false
