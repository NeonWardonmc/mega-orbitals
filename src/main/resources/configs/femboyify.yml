# femboyify.yml - MegaOrbitals cannon: Femboyify
#   Everyone nearby gets the same cute skin.
#   Mobs get the matching head too.
# Fire with /orbital femboyify   Give with /orbitalgive femboyify
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&d&lFemboyify'
# Description lines on the item.
lore:
- Everyone nearby gets the same cute skin.
- Mobs get the matching head too.
# Item type of the cannon item.
item: PINK_TULIP
# common, rare, epic or legendary (sets crafting core, drop pool and satellite charge cost).
tier: common
# Menu tab this cannon is listed under.
category: curses
# Put the terrain back after this many seconds (-1 = use config.yml, 0 = never).
auto-restore-seconds: -1
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 20
# Colour of the targeting ring.
warning-color: '#FF80D0'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 25
  # How long the skin lasts (0 = until they rejoin).
  seconds: 300
  # Put the skin's head on nearby mobs too.
  include-mobs: true
  # Signed skin texture value (from Mojang / mineskin.org). Change to use another skin.
  texture-value: 
  # Signature for the texture value above.
  texture-signature: 
