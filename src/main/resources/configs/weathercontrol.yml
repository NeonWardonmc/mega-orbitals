# weathercontrol.yml - MegaOrbitals cannon: Weather Control
#   Takes control of the weather: summon a
#   thunderstorm, rain or clear skies.
# Fire with /orbital weathercontrol   Give with /orbitalgive weathercontrol
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&9&lWeather Control'
# Description lines on the item.
lore:
- 'Takes control of the weather: summon a'
- thunderstorm, rain or clear skies.
# Item type of the cannon item.
item: LIGHTNING_ROD
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 10
# Colour of the targeting ring.
warning-color: '#6080C0'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # thunder, rain or clear.
  weather: thunder
  # How long the weather lasts.
  minutes: 10
