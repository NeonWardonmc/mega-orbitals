# kindling.yml - MegaOrbitals cannon: Kindling Curse
#   Turns everyone into kindling: any damage
#   at all sets them on fire.
# Fire with /orbital kindling   Give with /orbitalgive kindling
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&6&lKindling Curse'
# Description lines on the item.
lore:
- 'Turns everyone into kindling: any damage'
- at all sets them on fire.
# Item type of the cannon item.
item: STICK
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 10
# Colour of the targeting ring.
warning-color: '#FF9030'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 25
  # How long the curse lasts.
  seconds: 90
  # How long each hit makes them burn.
  burn-seconds: 5
