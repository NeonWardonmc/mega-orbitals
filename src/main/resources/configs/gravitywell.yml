# gravitywell.yml - MegaOrbitals cannon: Gravity Well
#   Crushing gravity pins everyone
#   to the ground. No jumping. No flying.
# Fire with /orbital gravitywell   Give with /orbitalgive gravitywell
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&8&lGravity Well'
# Description lines on the item.
lore:
- Crushing gravity pins everyone
- to the ground. No jumping. No flying.
# Item type of the cannon item.
item: ANVIL
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 30
# Colour of the targeting ring.
warning-color: '#404060'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range of the gravity well.
  radius: 25
  # How long it lasts.
  seconds: 15
  # Damage every second.
  crush-damage: 2.0
