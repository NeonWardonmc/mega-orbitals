# overgrowth.yml - MegaOrbitals cannon: Overgrowth
#   Explosive plant growth: moss, grass and
#   flowers everywhere, and crops grow instantly.
# Fire with /orbital overgrowth   Give with /orbitalgive overgrowth
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&a&lOvergrowth'
# Description lines on the item.
lore:
- 'Explosive plant growth: moss, grass and'
- flowers everywhere, and crops grow instantly.
# Item type of the cannon item.
item: BONE_MEAL
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 15
# Colour of the targeting ring.
warning-color: '#60E060'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 20
  # Turn stone and dirt into moss.
  moss: true
