# bodyswap.yml - MegaOrbitals cannon: Body Swap
#   The two players nearest the target swap bodies:
#   positions, health, hunger and inventories.
# Fire with /orbital bodyswap   Give with /orbitalgive bodyswap
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&d&lBody Swap'
# Description lines on the item.
lore:
- 'The two players nearest the target swap bodies:'
- positions, health, hunger and inventories.
# Item type of the cannon item.
item: ARMOR_STAND
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 15
# Colour of the targeting ring.
warning-color: '#E060E0'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # How far from the target to find the two players.
  range: 30
