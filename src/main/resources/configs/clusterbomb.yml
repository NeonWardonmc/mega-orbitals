# clusterbomb.yml - MegaOrbitals cannon: Cluster Bomb
#   One bomb splits into eight,
#   and each of those splits again.
# Fire with /orbital clusterbomb   Give with /orbitalgive clusterbomb
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&6&lCluster Bomb'
# Description lines on the item.
lore:
- One bomb splits into eight,
- and each of those splits again.
# Item type of the cannon item.
item: GUNPOWDER
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 20
# Colour of the targeting ring.
warning-color: '#FFA020'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Drop height.
  height: 45
  # Bomblets from the first split.
  first-split: 8
  # Bomblets from each second split.
  second-split: 4
  # Power of the final bomblets.
  power: 3.5
