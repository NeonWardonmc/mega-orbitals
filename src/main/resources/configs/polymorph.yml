# polymorph.yml - MegaOrbitals cannon: Polymorph
#   Turns every mob nearby into a chicken.
#   Players become as weak as one.
# Fire with /orbital polymorph   Give with /orbitalgive polymorph
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&e&lPolymorph'
# Description lines on the item.
lore:
- Turns every mob nearby into a chicken.
- Players become as weak as one.
# Item type of the cannon item.
item: EGG
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 20
# Colour of the targeting ring.
warning-color: '#FFF080'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 25
  # Also polymorph withers and wardens.
  include-bosses: false
  # How long players stay chicken-weak.
  player-seconds: 30
