# pinball.yml - MegaOrbitals cannon: Pinball
#   Everyone nearby turns into a pinball,
#   bouncing off in random directions.
# Fire with /orbital pinball   Give with /orbitalgive pinball
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&d&lPinball'
# Description lines on the item.
lore:
- Everyone nearby turns into a pinball,
- bouncing off in random directions.
# Item type of the cannon item.
item: SLIME_BALL
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 15
# Colour of the targeting ring.
warning-color: '#FF60FF'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 25
  # How long the bouncing lasts.
  seconds: 10
  # Bounce strength.
  bounce: 1.4
