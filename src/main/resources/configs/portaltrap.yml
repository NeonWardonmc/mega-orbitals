# portaltrap.yml - MegaOrbitals cannon: Portal Trap
#   Builds a lit Nether portal around every target
#   and holds them in it. Next stop: the Nether.
# Fire with /orbital portaltrap   Give with /orbitalgive portaltrap
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&5&lPortal Trap'
# Description lines on the item.
lore:
- Builds a lit Nether portal around every target
- 'and holds them in it. Next stop: the Nether.'
# Item type of the cannon item.
item: CRYING_OBSIDIAN
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 20
# Colour of the targeting ring.
warning-color: '#8000C0'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 15
  # Only trap players.
  players-only: true
