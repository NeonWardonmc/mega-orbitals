# deathstar.yml - MegaOrbitals cannon: Superlaser
#   A giant green beam from orbit that
#   vaporises a shaft down to bedrock.
# Fire with /orbital deathstar   Give with /orbitalgive deathstar
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&a&lSuperlaser'
# Description lines on the item.
lore:
- A giant green beam from orbit that
- vaporises a shaft down to bedrock.
# Item type of the cannon item.
item: SLIME_BLOCK
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 60
# Colour of the targeting ring.
warning-color: '#30FF30'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Radius of the beam.
  radius: 10
  # Damage to anything inside the beam.
  damage: 1000.0
  # How long the beam lasts.
  seconds: 6
