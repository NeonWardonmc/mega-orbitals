# mechpilot.yml - MegaOrbitals cannon: Mech Pilot
#   Drops a giant iron golem mech for you to ride.
#   Steer with WASD, swing to punch. Sneak to get out.
# Fire with /orbital mechpilot   Give with /orbitalgive mechpilot
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&7&lMech Pilot'
# Description lines on the item.
lore:
- Drops a giant iron golem mech for you to ride.
- Steer with WASD, swing to punch. Sneak to get out.
# Item type of the cannon item.
item: IRON_BLOCK
# common, rare, epic or legendary (sets crafting core, drop pool and satellite charge cost).
tier: epic
# Menu tab this cannon is listed under.
category: weapons
# Put the terrain back after this many seconds (-1 = use config.yml, 0 = never).
auto-restore-seconds: -1
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 25
# Colour of the targeting ring.
warning-color: '#C0C0C0'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # How long the mech lasts.
  seconds: 90
  # Size of the mech (1 = normal golem).
  scale: 3.0
  # Walking speed (blocks per tick).
  speed: 0.35
  # Damage of each punch.
  punch-damage: 16.0
  # How far the punch reaches.
  punch-range: 5.0
  # Ticks between punches.
  punch-cooldown-ticks: 15
  # Mech health.
  health: 300.0
