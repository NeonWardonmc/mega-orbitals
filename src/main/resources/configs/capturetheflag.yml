# capturetheflag.yml - MegaOrbitals cannon: Capture the Flag
#   Minigame: two bases, two flags. Nearby players
#   split into teams - steal the flag and bring it home!
# Fire with /orbital capturetheflag   Give with /orbitalgive capturetheflag
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&9&lCapture &c&lthe Flag'
# Description lines on the item.
lore:
- 'Minigame: two bases, two flags. Nearby players'
- split into teams - steal the flag and bring it home!
# Item type of the cannon item.
item: RED_BANNER
# common, rare, epic or legendary (sets crafting core, drop pool and satellite charge cost).
tier: epic
# Menu tab this cannon is listed under.
category: minigames
# Put the terrain back after this many seconds (-1 = use config.yml, 0 = never).
auto-restore-seconds: -1
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 20
# Colour of the targeting ring.
warning-color: '#8040FF'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Players this close to the target join the game.
  range: 40.0
  # Distance from the target to each base.
  base-distance: 20.0
  # Captures needed to win.
  captures-to-win: 3
  # Time limit.
  seconds: 300
  # Given to every player on the winning team.
  prize:
  - DIAMOND:3
  - GOLDEN_APPLE:2
