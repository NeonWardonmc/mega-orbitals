# floorislava.yml - MegaOrbitals cannon: The Floor Is Lava
#   Literally. The ground glows, then melts
#   patch by patch. Find high ground.
# Fire with /orbital floorislava   Give with /orbitalgive floorislava
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&c&lThe Floor Is Lava'
# Description lines on the item.
lore:
- Literally. The ground glows, then melts
- patch by patch. Find high ground.
# Item type of the cannon item.
item: LAVA_BUCKET
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 20
# Colour of the targeting ring.
warning-color: '#FF4010'
# Whether this cannon may break / change blocks.
break-blocks: true
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 16
  # How long the melting goes on.
  seconds: 30
  # Ground blocks that melt each second.
  patches-per-second: 25
