# yank.yml - MegaOrbitals cannon: Grapple Yank
#   A grappling beam hooks everyone near the target
#   and yanks them through the air toward you.
# Fire with /orbital yank   Give with /orbitalgive yank
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&6&lGrapple Yank'
# Description lines on the item.
lore:
- A grappling beam hooks everyone near the target
- and yanks them through the air toward you.
# Item type of the cannon item.
item: FISHING_ROD
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 10
# Colour of the targeting ring.
warning-color: '#C08040'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range around the target.
  radius: 20
  # How hard they're yanked.
  strength: 2.5
