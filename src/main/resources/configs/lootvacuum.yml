# lootvacuum.yml - MegaOrbitals cannon: Loot Vacuum
#   Sucks up every dropped item and XP orb in a
#   big radius and delivers it all to you.
# Fire with /orbital lootvacuum   Give with /orbitalgive lootvacuum
# Run /orbital reload after editing.

# Display name of the cannon item (& colour codes).
name: '&a&lLoot Vacuum'
# Description lines on the item.
lore:
- Sucks up every dropped item and XP orb in a
- big radius and delivers it all to you.
# Item type of the cannon item.
item: HOPPER
# Warning time before the strike hits (20 ticks = 1 second).
warning-ticks: 10
# Colour of the targeting ring.
warning-color: '#60FF60'
# Whether this cannon may break / change blocks.
break-blocks: false
# Whether the person who fired it can be hurt by it.
hurt-shooter: false
settings:
  # Range.
  radius: 64
