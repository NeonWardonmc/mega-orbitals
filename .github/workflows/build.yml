# Builds the plugin on every push and pull request (the jar is attached to the run as an artifact).
# Pushing a tag like v1.3.0 also publishes a GitHub Release with the jar attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MegaOrbitals
          path: target/MegaOrbitals-*.jar

      - name: Check tag matches pom version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          POM_VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ "v$POM_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pom.xml version $POM_VERSION"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "No CHANGELOG.md section for $VERSION." > release-notes.md; fi
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/MegaOrbitals-*.jar
          body_path: release-notes.md
          generate_release_notes: true
